; Optional user override for HD texture pack users.
; How to use: copy this file to
;   Documents\My Games\BIA Hells Highway\SumacGame\Config\
; and merge these two sections into your existing SumacEngine.ini there
; (do not overwrite the whole file, the game keeps other settings in it).
; Delete your existing SumacEngine.ini instead and the game will rebuild it
; from the v2 BaseEngine.ini, after which you can re-apply this override.
;
; Only use this with an HD texture pack installed (see HD-TEXTURES.md) and
; after patching the game .exe with a 4 GB / Large Address Aware patch.
; On a stock install, keep PoolSize=1024 from BaseEngine.ini.

[TextureStreaming]
PoolSize=2048

[SystemSettings]
TEXTUREGROUP_World=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_WorldNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_Character=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_CharacterNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_Weapon=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_WeaponNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
