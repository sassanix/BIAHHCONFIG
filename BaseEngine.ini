FogVolumes=True
FloatingPointRenderTargets=True
Trilinear=True
OneFrameThreadLag=False
UseVsync=True
UpscaleScreenPercentage=False
Fullscreen=True
AllowD3D10=False
EnableHighPolyChars=True
SkeletalMeshLODBias=0
ParticleLODBias=0
DetailMode=2
ShadowFilterQualityBias=1
ShadowFilterRadius=4
MinShadowResolution=32
MaxShadowResolution=2048
ShadowTexelsPerPixel=2.0
bAllowHardwareShadowFiltering=True
MaxAnisotropy=16
; Note: DirectX 9 UE3 games do not reliably honour MaxMultisamples in-game.
; For real anti-aliasing, force SGSSAA in NVIDIA Profile Inspector with
; compatibility flag 0x000010C1 (see PCGamingWiki), or use ReShade / DSR.
MaxMultisamples=4
ResX=3440
ResY=1440
ScreenPercentage=100.0
SceneCaptureStreamingMultiplier=1.0
FoliageDrawRadiusMultiplier=1.0
; --- Texture groups ---
; UE3 renders at most 4096x4096 per texture (13 mips, MAX_TEXTURE_MIP_COUNT),
; so the v1 MaxLODSize=8192 values were clamped by the engine anyway.
; LODBias is an offset from the size the texture was authored at. Negative
; values cannot create detail that is not in the source file, they only cost
; memory and can cause shimmer. 0 means: always show the full authored
; resolution, which is the correct setting for both stock and HD textures.
TEXTUREGROUP_World=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_WorldNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_WorldSpecular=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_Character=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
TEXTUREGROUP_CharacterNormalMap=(MinLODSize=1,MaxLODSize=4096,LODBias=0)
