; =============================================================================
; Merged System Settings
; (Merged from two [SystemSettings]
; v2 rewrite. Every key below is a real Unreal Engine 3 SystemSettings key.
; v1 mixed in keys from other engines and later Unreal versions (cascaded
; shadow maps, screen space reflections, SSGI, temporal AA, volumetric fog)
; and invented quality keys. UE3 silently ignores unknown keys, so none of
; those settings did anything. They are removed, see AUDIT.md.
