; =============================================================================
; Texture Streaming Settings
; =============================================================================
[TextureStreaming]
; v2 rewrite. The game is a 32-bit DirectX 9 executable, so it has at most
; ~2 GB of usable address space (about 4 GB with a Large Address Aware patch).
; PoolSize is in MB. The v1 value of 24000 (24 GB) could never be honoured and
; invites out-of-memory crashes and streaming thrash; a big pool does not add
; texture detail, it only decides how long loaded mips are kept resident.
; 1024 MB suits the stock textures. If you install an HD texture pack (see
; HD-TEXTURES.md), use the HD override in user-config/ (PoolSize=2048) and
; patch the game executable with a 4 GB / Large Address Aware patch first.
PoolSize=1024
HysteresisLimit=60
DropMipLevelsLimit=16
StopIncreasingLimit=10
StopStreamingLimit=7
MinFudgeFactor=1.0
FudgeFactorIncreaseRateOfChange=0.5
FudgeFactorDecreaseRateOfChange=-0.4
MinRequestedMipsToConsider=7
MinTimeToGuaranteeMinMipCount=0
MaxTimeToGuaranteeMinMipCount=0
; v1 set this to False. Keep it True: HD texture packs for UE3 games are
; delivered as .tfc texture file caches and are installed with TFC Installer.
UseTextureFileCache=True

[StreamByURL]
PostLoadPause=0.0

